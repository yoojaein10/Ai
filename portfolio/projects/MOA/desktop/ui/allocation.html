<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MOA · 유치실적</title>
  <link rel="icon" type="image/svg+xml" href="/ui/moa-icon.svg">
  <link rel="stylesheet" href="/ui/dashboard.css?v=20260821-2">
  <link rel="stylesheet" href="/ui/desktop.css?v=20260820-1">
  <style>
    /* 비율 합계가 100%가 아닐 때 경고 (승인은 허용) */
    .ratio-input.ratio-off{background:#fff8dc;border-color:#d4a017}
    /* 공용 amount-input(120px)이 90px 비율 컬럼을 넘어 '100'이 잘려 보이던 문제 */
    .allocation-table input.ratio-input{width:70px}
    /* 실입금액이 순수수료보다 적은 분할입금 건 */
    .paid-short{color:#c62828;font-weight:600}
    .allocation-table tfoot td{font-weight:700;background:#eef2f4;border-top:2px solid #9ca3af}
    .new-person-cell{display:flex;gap:4px;align-items:center}
    .new-person-cell .person-name{width:110px}
    .remove-person{border:none;background:none;color:#b04a4a;cursor:pointer;font-size:14px}
    .add-person-button{margin-top:4px}
    .approved-only-filter{align-self:flex-end;flex-direction:row!important;align-items:center;gap:7px;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
    .approved-only-filter input{width:auto;height:auto;margin:0}
    .approved-value{display:inline-block;min-width:70px;padding:7px 4px;color:#263238}
    .approval-meta{font-size:12px;line-height:1.45;color:#455a64;white-space:nowrap}
    .approval-meta strong{display:block;color:#263238}
    @media print{
      .print-area table.allocation-print-table{table-layout:fixed;border:1.4px solid #111}
      .print-area .allocation-print-table .print-customer{white-space:normal;overflow-wrap:anywhere;word-break:keep-all}
      /* 공용 인쇄 테두리(#999)가 흐려서 승인 출력물은 진하게 뽑는다 */
      .print-area .allocation-print-table th,
      .print-area .allocation-print-table td{border:1px solid #111}
      .print-area .allocation-print-table thead th{border-bottom:1.4px solid #111;
        background:#d0d4d8;color:#000;font-weight:800;
        -webkit-print-color-adjust:exact;print-color-adjust:exact}
      .print-area .allocation-print-table tr.print-total td{border-top:1.4px solid #111}
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">본문으로 바로가기</a>
  <header class="topbar">
    <div class="brand-block"><span class="brand-logo"><img src="/ui/moa-icon.svg" alt="">MOA</span><h1>유치실적</h1></div>
  </header>
  <div class="app-shell">
    <aside class="sidebar" aria-label="업무 메뉴">
      <p class="sidebar-label">업무 메뉴</p>
      <nav class="side-nav"></nav>
    </aside>
  <main id="main-content">
    <section class="toolbar allocation-toolbar" aria-label="검색 조건">
      <label><span>입금 시작일</span><input id="dateFrom" type="date"></label>
      <label><span>입금 종료일</span><input id="dateTo" type="date"></label>
      <label><span>감정서번호</span><input id="docQuery" type="text" placeholder="감정서번호" maxlength="50" autocomplete="off"></label>
      <label><span>유치자</span><input id="managerQuery" type="text" placeholder="이름" maxlength="30" autocomplete="off"></label>
      <label class="approved-only-filter"><input id="approvedOnly" type="checkbox"><span>승인된 건만 보기</span></label>
      <button id="searchButton" class="primary-button" type="button">조회</button>
    </section>
    <section class="workspace allocation-workspace">
      <article class="list-panel allocation-panel">
        <div class="panel-heading">
          <div><h2 id="listTitle">유치실적 대기</h2><p id="resultSummary">조회 중...</p></div>
          <div class="heading-actions">
            <label id="selectionControls" class="check-all-label"><input type="checkbox" id="checkAll"> 전체 선택</label>
            <button id="printButton" class="export-button print-button hidden" type="button">인쇄</button>
            <button id="exportButton" class="export-button" type="button">엑셀 내보내기</button>
            <button id="bulkApprove" class="primary-button" type="button" disabled>선택 일괄 승인</button>
          </div>
        </div>
        <div class="table-wrap">
          <table id="allocationTable" class="allocation-table">
            <colgroup>
              <col id="selectionColumn" style="width:40px"><col style="width:140px"><col style="width:90px"><col style="width:180px">
              <col style="width:100px"><col style="width:120px"><col style="width:120px"><col style="width:90px">
              <col style="width:130px"><col style="width:130px"><col style="width:160px">
            </colgroup>
            <thead>
              <tr>
                <th id="selectionHeader" class="check-cell"></th><th>감정서번호</th><th>유치자</th><th>거래처명</th>
                <th>입금일</th><th class="number">순수수료</th><th class="number">실입금액</th>
                <th class="number">비율(%)</th><th class="number">배분액</th><th class="number">실적인정금액</th><th id="actionHeader">처리</th>
              </tr>
            </thead>
            <tbody id="allocationRows"></tbody>
            <tfoot id="allocationTotals"></tfoot>
          </table>
          <div id="emptyList" class="empty hidden">입력 대기 중인 매출이 없습니다.</div>
        </div>
      </article>
    </section>
  </main>
  </div>
  <datalist id="empList"></datalist>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <div id="printArea" class="print-area" aria-hidden="true"></div>
  <script src="/ui/context.js?v=20260911-1"></script>
  <script src="/ui/column-resize.js"></script>
  <script src="/ui/allocation.js?v=20260821-1"></script>
</body>
</html>
