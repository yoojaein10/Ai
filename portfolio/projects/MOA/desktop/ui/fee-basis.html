<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MOA · 보수기준 점검</title>
  <!-- 서버(/desktop/fee-basis)와 로컬 파일(file://.../desktop/ui) 양쪽에서
       같은 공용 자산을 읽는다. 절대 /ui 경로는 file://로 열면 CSS가 빠진다. -->
  <link rel="icon" type="image/svg+xml" href="../ui/moa-icon.svg">
  <link rel="stylesheet" href="../ui/dashboard.css">
  <link rel="stylesheet" href="../ui/desktop.css">
  <style>
    .toolbar{display:block}
    .fb-toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    .fb-toolbar .grp{display:flex;gap:6px;align-items:center}
    .fb-toolbar .grp>strong{white-space:nowrap}
    .fb-toolbar select,.fb-toolbar input{height:32px;border:1px solid var(--line);border-radius:8px;padding:0 8px}
    .fb-toolbar input.year{width:74px}
    .fb-hint{font-size:12px;color:var(--muted);margin:6px 0}
    .fb-fixed{font-size:12px;color:#455a64;padding:0 2px}
    /* 조회 전·결과 없음 안내. 패널이 이미 테두리를 가지므로 자체 테두리를 주면
       상자 속 상자가 되어 빈 표처럼 보인다 — 글자만 둔다. */
    .fb-empty{padding:44px 16px;text-align:center;color:var(--muted);font-size:13px}
    /* 집계는 패널 제목 아래 한 줄이다(다른 화면의 resultSummary 자리). */
    .fb-summary .it{white-space:nowrap;margin-right:16px}
    .fb-summary b{margin-left:3px;font-variant-numeric:tabular-nums}
    /* 공용 .workspace 는 목록+상세 2열 그리드다. 이 화면은 패널이 하나뿐이라
       그대로 두면 첫 열(~65%)만 차지해 툴바와 폭이 어긋난다. 1열로 편다.
       min-height 도 푼다 — 조회 전 빈 패널이 화면 높이만큼 늘어나 빈 표처럼 보인다. */
    .workspace{grid-template-columns:1fr;min-height:0}
    /* 표 자체는 dashboard.css 공용 스타일(.list-panel > .table-wrap > table)을 쓴다.
       여기에는 이 화면 고유 요소만 둔다. 공용 최소폭 1480px 은 열이 9개라 과해서 줄인다. */
    /* 표는 내용 폭만큼 커지고(고정폭 열 합), 랩이 가로 스크롤을 만든다.
       공용 width:100% 를 그대로 두면 표가 컨테이너보다 커질 수 없어 스크롤 없이
       마지막 열이 잘린다(실측). fee-review 와 같은 패턴이다. */
    .list-panel > .table-wrap > table.fb-table{width:max-content;min-width:100%}
    .table-wrap{height:auto;max-height:calc(100dvh - 300px);min-height:0}
    /* 목록에서 찾기 — 거르지 않고 그 건 위치만 알려준다(업무실적 화면과 같은 방식) */
    .fb-find{display:flex;gap:8px;align-items:center;margin-left:auto;font-size:13px}
    .fb-find>strong{white-space:nowrap}
    /* 격차율 발생분만 보기 — 행을 지우지 않고 감추기만 한다(재렌더하면 입력 중인
       의견이 날아간다). 감춘 행의 입력값은 DOM 에 그대로 남아 저장에 포함된다. */
    .fb-gap-only{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
      font-weight:700;cursor:pointer}
    .fb-table tr.gap-hidden{display:none}
    .fb-find input{width:170px;height:30px;border:1px solid var(--line);
      border-radius:8px;padding:0 10px;font-size:13px}
    /* 위 .fb-find input 은 검색창(170px 상자)용이다. 체크박스까지 걸려 거대한 네모가
       됐다 — 같은 특정도(0,1,1)라 뒤에 오는 그쪽이 이겨서, 여기선 특정도를 올려 되돌린다. */
    .fb-gap-only input[type=checkbox]{width:15px;height:15px;min-width:0;margin:0;
      padding:0;border:none;border-radius:0;background:none;accent-color:#2f7bc4;
      cursor:pointer;flex:none}
    .fb-find-count{color:var(--muted);font-size:12px;white-space:nowrap;
      font-variant-numeric:tabular-nums}
    .fb-table tr.found td{background:#fff6d6}
    .fb-table tr.found-current td{background:#ffe08a;box-shadow:inset 0 0 0 1px #d9a520}
    /* 셀 안 줄바꿈 금지 — 공용 td 가 nowrap+말줄임을 준다. 자동판별 셀만 여러 줄
       (조문·근거·의견 입력)이라 세로 가운데 정렬이 자연스럽다. */
    .fb-table td{vertical-align:middle}
    .fb-table td.fb-num{text-align:right;font-variant-numeric:tabular-nums;
      white-space:nowrap}
    /* 감정서번호 칸은 공용 스타일이 좌측 고정·초록 고정폭으로 만든다. */
    .fb-badge{display:inline-block;padding:1px 8px;border-radius:9px;font-size:11px;
      font-weight:700;white-space:nowrap;background:#eef2f0;color:#6b7a72}
    /* 할인 적정성 경고(업무연락 제2026-38호) — 한도 초과·근거 없음만 주황으로. */
    .fb-badge.discount{background:#fdeecf;color:#a5541a}
    /* 이탈 행은 색으로 먼저 눈에 들어와야 한다(판정 열을 없앤 대신). */
    .fb-table tbody tr.is-below td{background:#dbeafb}     /* 80% 하한 미만 */
    .fb-table tbody tr.is-above td{background:#fbdcd8}     /* 120% 상한 초과 */
    .fb-table tbody tr.is-below td:first-child{box-shadow:inset 4px 0 0 #2f7bc4}
    .fb-table tbody tr.is-above td:first-child{box-shadow:inset 4px 0 0 #c0392b}
    /* 확정 의견은 자동판별 셀 안에 둔다 — 근거를 보면서 바로 고칠 수 있어야 한다.
       미저장 상태를 눈에 보이게 해야 담당자가 저장한 줄 알고 창을 닫지 않는다. */
    .fb-op{margin-top:3px;border-radius:6px}
    .fb-op input{display:block;width:100%;height:24px;box-sizing:border-box;
      border:1px solid transparent;border-radius:5px;padding:0 5px;background:transparent;
      color:#315d75;font:inherit;font-weight:700}
    .fb-op input:hover{border-color:#cbd8d2;background:#fff}
    .fb-op input:focus{border-color:#315d75;background:#fff;
      outline:2px solid rgba(49,93,117,.14)}
    .fb-op.dirty{background:#fff1b8}
    .fb-op.dirty input{border-color:#d29b00;background:#fff9df}
    .fb-save-status{min-width:90px;font-size:11.5px;color:var(--muted);white-space:nowrap}
    .fb-save-status.success{color:#2f7250}
    .fb-save-status.warning{color:#b26a00}
    .fb-save-status.error{color:#b42318}
    /* 정상일 때는 비어 있고, 알려야 할 실패가 있을 때만 보인다. */
    .fb-meta{font-size:11.5px;color:var(--muted);margin:4px 0 0}
    .fb-meta.warn{color:#b42318;font-weight:700}
    .fb-cand{margin:0;padding:0;list-style:none}
    /* 조문·근거는 각 한 줄로 자르고 말줄임한다. 전체 문장은 셀 설명(title)에 있다.
       줄바꿈을 허용하면 행 높이가 제멋대로 늘어난다. */
    .fb-cand .lbl{display:block;font-weight:700;white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis}
    .fb-cand .ev{display:block;color:var(--muted);font-size:12px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .fb-doc{white-space:nowrap;font-variant-numeric:tabular-nums}
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">본문으로 바로가기</a>
  <header class="topbar">
    <div class="brand-block"><span class="brand-logo"><img src="../ui/moa-icon.svg" alt="">MOA</span><h1>보수기준 점검</h1></div>
  </header>
  <div class="app-shell">
    <aside class="sidebar" aria-label="업무 메뉴">
      <p class="sidebar-label">업무 메뉴</p>
      <nav class="side-nav"></nav>
    </aside>
  <main id="main-content">
    <section class="toolbar" aria-label="보수기준 점검 조회">
      <div class="fb-toolbar">
        <div class="grp"><strong>지사</strong><select id="officeCode"></select></div>
        <div class="grp"><strong>년월</strong><input id="year" class="year" type="number" min="2010" max="2099"> 년
          <select id="month"></select> 월</div>
        <div class="grp"><strong>반월</strong>
          <select id="half"><option value="상반">상반 (1~15일)</option><option value="하반">하반 (16~말일)</option></select></div>
        <!-- 기준은 매출(입금) 하나로 고정한다. 재무팀이 쓰는 기준이고 사전생성 배치도
             이것만 만든다. 선택으로 두면 다른 기준을 골랐을 때 80초를 기다린다. -->
        <div class="grp"><strong>기준</strong>
          <span class="fb-fixed">매출(입금)기준</span></div>
        <button id="runButton" class="primary-button" type="button">조회</button>
        <button id="saveButton" type="button" disabled style="border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 14px;font-weight:700;cursor:pointer">의견 저장</button>
        <button id="exportButton" class="rc-export" type="button" style="border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 14px;font-weight:700;cursor:pointer">엑셀 다운로드</button>
        <span id="saveStatus" class="fb-save-status" role="status" aria-live="polite"></span>
      </div>
      <p id="runMeta" class="fb-meta" role="status" aria-live="polite"></p>
      <p class="fb-hint">업무실적과 같은 모집단에서, 수수료청구서에 입력된 보수기준과 자동판별(목적·본문 근거) 결과를 비교합니다. 본문 근거는 감정서 PDF가 파싱된 건에서만 나옵니다.</p>
    </section>
    <!-- 다른 화면(매출 입력 대기 등)과 같은 구조다. dashboard.css 의
         .list-panel > .table-wrap > table 공용 스타일이 여기에 걸린다. -->
    <section class="workspace">
      <article class="list-panel">
        <div class="panel-heading">
          <div><h2>보수기준 점검</h2><p id="summary" class="fb-summary"></p></div>
          <div class="fb-find">
            <label class="fb-gap-only" title="격차율이 0.0%가 아닌 행만 보여줍니다. 엑셀 내보내기도 같은 기준으로 나갑니다.">
              <input id="gapOnly" type="checkbox">격차율 발생분만</label>
            <span id="gapOnlyCount" class="fb-find-count"></span>
            <strong>검색</strong>
            <input id="rowFilter" type="search" placeholder="감정서번호">
            <span id="filterCount" class="fb-find-count"></span>
          </div>
        </div>
        <div class="table-wrap" id="tableWrap"></div>
        <div id="empty" class="fb-empty">년월·반월을 고르고 "조회"를 누르세요.</div>
      </article>
    </section>
  </main>
  </div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <!-- ?v= 없이 두면 브라우저가 옛 JS를 계속 써서 서버가 맞게 보내도 화면이 안 바뀐다. -->
  <script src="../ui/context.js?v=20260911-1"></script>
  <script src="../ui/column-resize.js?v=20260731-01"></script>
  <script>
// 보수기준 점검: 업무실적 모집단에서 수수료청구서 입력값 vs 자동판별 보수기준 비교.
// 자동판별 근거(목적·본문 발췌·이력)를 행 안에 함께 보여준다. 본사 전용 화면.
(function(){
  const $ = id => document.getElementById(id);

  // 저장 상태. draft 는 아직 저장하지 않은 편집분이다.
  // query 는 마지막 조회 시점의 조건이다 — 저장·엑셀은 반드시 이것을 쓴다.
  // 현재 툴바 값을 쓰면 조회 후 반월·월·지사를 바꾸고 저장했을 때
  // 화면과 다른 기간에 의견이 붙는다.
  const state = {
    runId: null,
    sourceSha: null,
    items: [],
    draft: new Map(),
    saving: false,
    loading: false,
    query: null,
  };

  function initControls(){
    const monthSelect = $('month');
    monthSelect.innerHTML = Array.from({length: 12}, (_, i) =>
      `<option value="${i + 1}">${i + 1}</option>`).join('');
    const now = new Date();
    $('year').value = now.getFullYear();
    monthSelect.value = String(now.getMonth() + 1);
    const office = $('officeCode');
    if(office){
      Array.from(office.options).forEach(opt => { if(opt.value === 'all') opt.remove(); });
    }
  }

  // 기준은 매출(입금)으로 고정이다. 재무팀 기준이고 사전생성 배치도 이것만 만든다.
  const BASIS = '매출';

  function params(){
    return new URLSearchParams({
      usr_seq: String((window.A10_CTX && window.A10_CTX.usr_seq) || window.A10_USR || ''),
      office_code: window.A10_OFFICE(),
      year: $('year').value,
      month: $('month').value,
      half: $('half').value,
      basis: BASIS,
    });
  }

  function screenQuery(){
    const query = params();
    query.set('page_size', '1000');
    return query;
  }

  const esc = value => String(value == null ? '' : value)
    .replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const won = new Intl.NumberFormat('ko-KR', { maximumFractionDigits: 0 });
  const num = value => (value == null || value === '' ? '' : won.format(Math.round(Number(value))));
  const pct = value => {
    if(value == null || value === '') return '';
    return `${(Number(value) * 100).toFixed(1).replace(/\.0$/, '')}%`;
  };

  // 요율적용금액 — 적용한 요율 밴드에 할인까지 반영한 금액(재무팀 엑셀 Y열).
  // 이 값과 청구 순수수료를 나란히 두면 얼마가 어긋났는지 눈으로 바로 보인다.
  // 금액을 못 구하는 행은 그 이유를 이 칸에 남긴다 — 빈 칸만 두면 왜 비었는지 모른다.
  // 격차율 = 청구 순수수료 ÷ **요율적용금액** − 1 (재무팀 엑셀 Z열 정의).
  // 바로 왼쪽 두 칸(요율적용금액·순수수료)의 차이를 %로 옮긴 값이라, 눈으로 본
  // 차이와 숫자가 어긋나지 않는다. 요율을 모르는 행은 기준선이 없어 빈 칸이다.
  // 이탈한 쪽만 색을 준다 — 색이 넷이면 무엇이 급한지 알 수 없다.
  // 격차율이 '발생'한 행인가 — gapCell 이 0.0% 로 뭉개는 값은 발생이 아니다.
  // 두 곳의 기준이 갈리면 화면엔 0.0% 인데 '발생분만'에 뜨는 행이 생긴다.
  // (서버의 flt=격차발생 / GAP_OCCURRED_MIN 과도 같은 선이다)
  function gapOccurred(item){
    const gap = item.reference_gap_rate;
    if(gap == null) return false;   // 요율 미상 = 기준선이 없을 뿐, 발생이 아니다
    return Math.abs(Number((gap * 100).toFixed(1))) >= 0.05;
  }

  function gapCell(item){
    const gap = item.reference_gap_rate;
    if(gap == null) return '';
    // 요율적용금액은 원 미만이 남고 청구액은 원 단위라, 정확히 기준대로 청구한
    // 건도 1원쯤 어긋난다. 그대로 찍으면 '-0.0%' 가 되어 깎인 것처럼 보인다 —
    // 반올림해서 0.0 이 되는 값은 부호를 떼고 0.0% 하나로 모은다.
    let pct = (gap * 100).toFixed(1);
    if(Math.abs(Number(pct)) < 0.05) pct = '0.0';
    // deviation_direction 은 한글이다 — '기준 내' / '하한 미만' / '상한 초과'.
    const dir = String(item.deviation_direction || '');
    const colour = dir.includes('하한') ? '#2f7bc4' : (dir.includes('상한') ? '#c0392b' : '');
    const sign = Number(pct) > 0 ? '+' : '';
    return colour
      ? `<b style="color:${colour}" title="${esc(dir)}">${sign}${pct}%</b>`
      : `${sign}${pct}%`;
  }

  function appliedFeeCell(item){
    if(item.rate_applied_fee != null) return num(item.rate_applied_fee) + discountBadge(item);
    const reason = item.fee_state || (item.rate_conflict ? '요율 원천 충돌' : '');
    if(reason) return `<span class="fb-badge noparse">${esc(reason)}</span>` + discountBadge(item);
    // SusuRate 가 0.8/1.0/1.2 밖(0.9·1.1 등)이면 밴드 금액을 못 구한다.
    // 빈칸만 두면 왜 비었는지 알 수 없으니 원천 요율·실효율을 그대로 보여준다.
    return (item.rate_label
      ? `<span class="fb-badge noparse" title="요율이 하한·기준·상한 밴드 밖이라 금액을 특정할 수 없습니다">${esc(item.rate_label)}</span>`
      : '') + discountBadge(item);
  }

  // 할인 적정성(업무연락 제2026-38호) — 조치가 필요한 두 상태만 배지로 띄운다.
  // '구간 내'·'대상 외'는 소음이라 title(비고)로만 남긴다. 검색어로도 거를 수 있게
  // data-find 에 상태를 넣는다(예: '한도 초과' 입력).
  function discountBadge(item){
    const st = String(item.discount_state || '');
    if(st !== '한도 초과 의심' && st !== '근거 없음') return '';
    return ` <span class="fb-badge discount" title="${esc(item.discount_note || '')}">할인 ${esc(st)}</span>`;
  }

  // 색은 이탈 판정 둘만 쓴다. 색이 넷이면 무엇이 급한지 알 수 없다.
  // 비교 불가·요율 미설명은 해당 칸의 배지와 집계로 본다.
  function rowClass(item){
    if(item.deviation_direction === '하한 미만') return ' class="is-below"';
    if(item.deviation_direction === '상한 초과') return ' class="is-above"';
    return '';
  }

  // 자동판별은 대표 후보 정확히 한 줄이다. 두 줄로 보이면 담당자가 어느 값을 써야
  // 할지 알 수 없다. 대표 선정은 서버(fee_basis_evidence.pick_primary)에서 하므로
  // 화면·엑셀·의견 초기값이 늘 같은 값을 쓴다.
  function candidateList(item){
    const all = item.candidates || [];
    const primary = item.primary_candidate || all[0] || null;
    if(!primary) return opinionInput(item);
    // 출처·등급·파싱없음 같은 꼬리표는 화면에 붙이지 않는다. 조문 이름과 근거만 둔다.
    // 그 값들은 셀 설명(title)과 엑셀에 남아 감사 때 되짚을 수 있다.
    const page = primary.page ? ` p${primary.page}` : '';
    // 입력된 보수기준 열은 없앴다. 코드 일치/불일치 판정의 근거이므로 설명에 남긴다.
    const entered = item.entered_label
      ? `입력값: ${item.entered_label}${item.entered_bigo ? ` (${item.entered_bigo})` : ''}`
      : '입력값: 없음(미입력)';
    const others = all.filter(c => c !== primary);
    const tip = [
      `근거: ${primary.source || '-'}${page}`
        + (primary.grade ? ` (${primary.grade})` : ''),
      String(primary.evidence || ''),
      item.parsed ? '' : '감정서 PDF 미파싱 — 본문 근거 없이 목적·이력만으로 판별',
      entered,
    ]
      .concat(others.map(c => `(대안) ${c.source} · ${c.label}`))
      .filter(Boolean)
      .join(' | ');
    return `<div class="fb-cand" title="${esc(tip)}">`
      + `<span class="lbl">${esc(primary.label)}</span>`
      + `<span class="ev">${esc(primary.evidence)}</span></div>`
      + opinionInput(item);
  }

  // 지금 적혀 있는 의견을 그 자리에서 고친다. 빈 입력칸을 따로 두지 않는다 —
  // 값이 텍스트처럼 보이고 마우스를 올리거나 누르면 편집 상태가 된다.
  // 원천 금액·근거는 읽기 전용이고 의견만 고칠 수 있다.
  function opinionInput(item){
    // 키는 감정서번호다. 행 번호는 순번이라 원천에 행이 추가·삭제되면 옛 의견이
    // 엉뚱한 감정서에 붙는다.
    const doc = item.doc_id;
    const value = state.draft.has(doc)
      ? state.draft.get(doc)
      : String(item.effective_opinion || '');
    const dirty = state.draft.has(doc) ? ' dirty' : '';
    return `<div class="fb-op${dirty}">`
      + `<input type="text" maxlength="500" value="${esc(value)}"`
      + ` data-doc="${esc(doc)}" data-base="${esc(item.effective_opinion || '')}"`
      + ` aria-label="의견"></div>`;
  }

  function bindOpinionInputs(){
    document.querySelectorAll('.fb-op input').forEach(input => {
      input.addEventListener('input', () => {
        const doc = input.dataset.doc;
        const base = input.dataset.base || '';
        const cell = input.closest('.fb-op');
        if(input.value === base){
          state.draft.delete(doc);
          cell.classList.remove('dirty');
        }else{
          state.draft.set(doc, input.value);
          cell.classList.add('dirty');
        }
        syncButtons();
      });
    });
  }

  function syncButtons(){
    const dirty = state.draft.size > 0;
    const busy = state.loading || state.saving;
    $('runButton').disabled = busy;
    // 의견은 스냅숏과 별도로 저장되므로 스냅숏 저장 실패와 무관하게 저장할 수 있다.
    // 다만 조회 전에는 어느 기간에 저장할지 알 수 없다.
    $('saveButton').disabled = busy || !dirty || !state.query
      || !state.runId || !state.sourceSha;
    $('saveButton').textContent = state.saving ? '저장 중…' : '의견 저장';
    // 미저장 상태로 내려받으면 화면과 엑셀의 의견이 다른 파일이 나온다.
    $('exportButton').disabled = busy || dirty || !state.query
      || !state.runId || !state.sourceSha;
    $('exportButton').title = dirty ? '의견을 저장한 뒤 내려받아 주세요.' : '';
  }

  function setSaveStatus(message, kind){
    const el = $('saveStatus');
    el.textContent = message || '';
    el.classList.toggle('success', kind === 'success');
    el.classList.toggle('warning', kind === 'warning');
    el.classList.toggle('error', kind === 'error');
  }

  // 정상일 때는 아무것도 표시하지 않는다. 조회가 잘 된 사실은 표 자체가 말한다.
  // 알려야 하는 것만 남긴다 — 근거 원천이 죽어도 행 수는 그대로 나오므로,
  // 표시하지 않으면 근거 0건 결과를 확정본으로 쓴다(실측 사례).
  function renderMeta(data){
    const parts = [];
    // 의견은 감정서번호로 맞추므로 엉뚱한 행에 붙지는 않는다. 다만 저장 당시와 금액이
    // 달라졌으면 금액을 적은 의견이 낡았을 수 있어 재확인을 안내한다.
    if(data.opinions_stale) parts.push('원천 변경 — 저장 의견 재확인 필요');
    const summary = data.summary || {};
    if(summary.jun_error) parts.push('JUN 근거 조회 실패');
    if(summary.apw_error) parts.push('APWorks 사유 조회 실패');
    if(summary.prior_error) parts.push('이전 감정서 조회 실패');
    const el = $('runMeta');
    el.textContent = parts.join(' · ');
    el.classList.toggle('warn', parts.length > 0);
  }

  // run() 과 달리 state.draft 를 지우지 않는다. opinionInput() 이 draft 를 우선 표시하므로
  // 다시 그려도 입력값과 dirty 표시가 그대로 남는다. 낡은 토큰을 갱신하는 게 목적이다.
  async function reloadKeepingDraft(){
    // 화면 데이터와 같은 조건으로 다시 부른다. screenQuery() 를 쓰면 저장 중에 툴바를
    // 바꾼 경우 다른 기간을 불러와 입력분이 엉뚱한 기간에 붙는다.
    const response = await fetch(`/api/fee-basis?${state.query}`);
    const payload = await response.json();
    if(!payload.success) throw new Error(payload.message || '재조회에 실패했습니다.');
    state.items = payload.data.items || [];
    state.runId = payload.data.run_id || null;
    state.sourceSha = payload.data.source_sha256 || null;
    render(payload.data);
    renderMeta(payload.data);
  }

  async function save(retried){
    if(!state.draft.size || state.saving || !state.query
      || !state.runId || !state.sourceSha) return;
    state.saving = true;
    syncButtons();
    setSaveStatus('저장 중…', 'warning');
    // 보낸 내용을 그대로 기억해 둔다. 저장이 나는 동안 사용자가 더 입력했을 수 있어,
    // 성공 시 '보낸 값과 지금 값이 같은 칸'만 저장된 것으로 처리한다(검토 발견).
    // 재생성으로 목록에서 빠진 감정서를 함께 보내면 서버가 저장 전체를 거부한다
    // ('…는 현재 목록에 없습니다'). 한 건 때문에 나머지를 잃지 않도록 걸러낸다.
    const present = new Set(state.items.map(item => String(item.doc_id || '').trim()));
    const sent = {};
    const dropped = [];
    state.draft.forEach((value, doc) => {
      if(present.has(doc)) sent[doc] = value; else dropped.push(doc);
    });
    if(!Object.keys(sent).length){
      state.saving = false;
      syncButtons();
      setSaveStatus('저장할 수 있는 행이 없습니다', 'error');
      window.A10_TOAST(`${dropped.join(', ')}는 현재 목록에 없습니다.`, true);
      return;
    }
    try{
      // 의견은 스냅숏과 분리된 행에 감정서번호로 저장된다. 배치가 지우지 않는다.
      // 조건은 조회 시점 것(state.query)이다 — 툴바를 바꿨어도 화면 데이터 기준으로 저장.
      const response = await fetch(`/api/fee-basis/opinions?${state.query}`, {
        method: 'PATCH',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          run_id: state.runId,
          source_sha256: state.sourceSha,
          opinions: sent,
        }),
      });
      const body = await response.json();
      // 배치가 원천을 갱신하면 조회 때 받은 토큰이 낡아 409 가 난다. 토큰을 새로 받는
      // 곳이 run() 하나뿐인데 run() 은 draft 를 지우므로, 예전에는 입력값을 버려야만
      // 저장 가능한 상태로 돌아갔다(검증 실측: 배치 중 60회 시도 전부 실패).
      // 입력분은 그대로 두고 토큰만 새로 받아 한 번 다시 시도한다.
      if(response.status === 409 && body.code === 'SOURCE_CHANGED' && !retried){
        await reloadKeepingDraft();
        setSaveStatus('원천이 갱신되어 최신 내용을 다시 불러왔습니다. 저장을 다시 눌러 주세요.', 'warning');
        return;
      }
      if(!response.ok || !body.success) throw new Error(body.message || '저장에 실패했습니다.');
      let savedCount = 0;
      Object.keys(sent).forEach(doc => {
        if(state.draft.get(doc) === sent[doc]){
          state.draft.delete(doc);
          savedCount++;
        }
      });
      document.querySelectorAll('.fb-op input').forEach(input => {
        const doc = input.dataset.doc;
        if(doc in sent && !state.draft.has(doc)){
          input.dataset.base = sent[doc];
          input.closest('.fb-op').classList.remove('dirty');
        }
      });
      setSaveStatus('저장 완료', 'success');
      window.A10_TOAST(`의견 ${savedCount}건을 저장했습니다.`);
      // 편집분이 안 남았으면 재조회로 서버 확정 상태를 보여준다(캐시라 0.1초).
      // 빈 칸은 '일부러 비운 기록'으로 저장되므로 재조회해도 자동 제안이 되살아나지
      // 않는다. 단, 저장 중 툴바를 바꿨으면 재조회가 다른 기간을 불러오므로 건너뛴다.
      if(!state.draft.size && screenQuery().toString() === state.query) await run();
    }catch(error){
      setSaveStatus('저장 실패', 'error');
      window.A10_TOAST(error.message, true);
    }finally{
      state.saving = false;
      syncButtons();
    }
  }

  // 조회된 목록에서 '어디 있는지' 찾아준다. 거르지 않는다 — 행을 숨기거나 다시
  // 그리면 입력 중인 의견과 확정 상태가 흐트러진다(업무실적 화면과 같은 방식).
  let findHits = [];
  let findIndex = 0;

  function applyFind(jumpNext){
    const input = $('rowFilter');
    const table = document.getElementById('fbTable');
    const label = $('filterCount');
    if(!input || !table) return;
    const q = input.value.trim().toLowerCase();
    findHits = [];
    table.querySelectorAll('tbody tr').forEach(tr => {
      tr.classList.remove('found-current');
      const hit = !!q && (tr.dataset.find || '').includes(q);
      tr.classList.toggle('found', hit);
      if(hit) findHits.push(tr);
    });
    if(!q){ findIndex = 0; if(label) label.textContent = ''; return; }
    if(!findHits.length){
      findIndex = 0;
      if(label) label.textContent = '찾는 건이 없습니다';
      return;
    }
    findIndex = jumpNext ? (findIndex + 1) % findHits.length : 0;
    const target = findHits[findIndex];
    target.classList.add('found-current');
    target.scrollIntoView({block: 'center', behavior: 'smooth'});
    if(label){
      label.textContent = findHits.length > 1
        ? `${findIndex + 1} / ${findHits.length}건 (Enter로 다음)`
        : '1건';
    }
  }

  function render(data){
    const s = data.summary || {};
    // 항목마다 nowrap 을 걸어 숫자와 단위가 갈라지지 않게 한다. flex 컨테이너에
    // <br> 을 넣으면 줄이 어긋나므로 줄 단위 블록으로 만든다.
    const item_ = (label, value, colour) => {
      const style = colour ? ` style="color:${colour}"` : '';
      return `<span class="it"${style}>${label} <b>${value ?? 0}</b></span>`;
    };
    // 집계는 이탈 둘만 본다. 코드 판정·본문 파싱·비교 불가는 표와 엑셀에서 확인한다.
    // <p> 안에 넣으므로 블록 요소를 쓰지 않는다 — 브라우저가 <p> 를 끊어버린다.
    $('summary').innerHTML =
      item_('총', s.total, '')
      + item_('80% 하한 미만', s.fee_below, '#2f7bc4')
      + item_('120% 상한 초과', s.fee_above, '#c0392b')
      // 할인 적정성(업무연락 제2026-38호) — 한도 초과·근거 없음 합계.
      + item_('할인 확인', s.discount_flagged, '#a5541a');
    const items = data.items || [];
    if(!items.length){
      $('tableWrap').innerHTML = '';
      $('empty').textContent = '조건에 맞는 감정서가 없습니다.';
      $('empty').style.display = '';
      return;
    }
    $('empty').style.display = 'none';
    const body = items.map(item => `<tr${rowClass(item)} data-gap="${gapOccurred(item) ? '1' : '0'}" data-find="${esc([
        item.doc_id, item.cust_name, item.work, item.purpose, item.manager,
        item.fee_state, item.discount_state,
      ].filter(Boolean).join(' ').toLowerCase())}">
      <td class="fb-doc">${esc(item.doc_id)}</td>
      <td class="fb-doc">${esc(item.receipt_date || '')}</td>
      <td>${esc(item.cust_name)}</td>
      <td>${esc(item.work)}${item.purpose ? ' / ' + esc(item.purpose) : ''}</td>
      <td>${esc(item.manager)}</td>
      <td class="number fb-num">${num(item.appraisal_amount)}</td>
      <td class="number fb-num">${appliedFeeCell(item)}</td>
      <td class="number fb-num">${num(item.actual_fee)}</td>
      <td class="number fb-num">${gapCell(item)}</td>
      <td>${candidateList(item)}</td>
    </tr>`).join('');
    $('tableWrap').innerHTML = `<table id="fbTable" class="fb-table">
      <colgroup><col style="width:126px"><col style="width:92px">
      <col style="width:150px"><col style="width:170px">
      <col style="width:64px"><col style="width:132px"><col style="width:122px">
      <col style="width:122px"><col style="width:82px"><col style="width:430px"></colgroup>
      <thead><tr><th>감정서번호</th><th>접수일</th><th>거래처</th>
      <th>업무 / 세부목적</th><th>유치자</th><th>감정평가액</th>
      <th>요율적용금액</th><th>순수수료</th>
      <th title="요율적용금액 대비 격차 (청구 순수수료 ÷ 요율적용금액 − 1). 왼쪽 두 칸의 차이와 같은 값이다.">격차율</th>
      <th>자동판별 (근거) · 확정 의견</th></tr></thead>
      <tbody>${body}</tbody></table>`;
    if (window.A10_COLUMN_RESIZE)
      window.A10_COLUMN_RESIZE(document.getElementById('fbTable'), 'a10.feeBasis.columnWidths.v2');
    applyGapOnly();
    applyFind(false);
    bindOpinionInputs();
    syncButtons();
  }

  // 격차율 발생분만 보기. 행을 다시 그리지 않고 감추기만 하므로 입력 중인 의견이
  // 살아 있고, 감춘 행의 의견도 저장에 그대로 포함된다.
  function applyGapOnly(){
    const on = $('gapOnly') && $('gapOnly').checked;
    const table = document.getElementById('fbTable');
    const label = $('gapOnlyCount');
    if(!table){ if(label) label.textContent = ''; return; }
    let shown = 0, total = 0;
    table.querySelectorAll('tbody tr').forEach(tr => {
      total += 1;
      const hide = on && tr.dataset.gap !== '1';
      tr.classList.toggle('gap-hidden', hide);
      if(!hide) shown += 1;
    });
    if(label) label.textContent = on ? `${shown} / ${total}건` : '';
  }

  async function run(){
    if(state.draft.size && !window.confirm('저장하지 않은 의견이 있습니다. 조회하면 사라집니다. 계속할까요?')) return;
    state.loading = true;
    state.draft.clear();
    setSaveStatus('');
    syncButtons();
    $('tableWrap').innerHTML = '';
    $('empty').textContent = '조회 중...';
    $('empty').style.display = '';
    try{
      const query = screenQuery();
      const response = await fetch(`/api/fee-basis?${query.toString()}`);
      const payload = await response.json();
      if(!payload.success) throw new Error(payload.message || '조회에 실패했습니다.');
      state.items = payload.data.items || [];
      state.query = query.toString();
      state.runId = payload.data.run_id || null;
      state.sourceSha = payload.data.source_sha256 || null;
      render(payload.data);
      renderMeta(payload.data);
    }catch(error){
      // 실패한 조회의 흔적(이전 집계·표·경고)이 남으면 방금 조건의 결과로 오해한다.
      state.items = [];
      state.query = null;
      state.runId = null;
      state.sourceSha = null;
      $('summary').innerHTML = '';
      $('tableWrap').innerHTML = '';
      const meta = $('runMeta');
      meta.textContent = '';
      meta.classList.remove('warn');
      window.A10_TOAST(error.message, true);
      $('empty').textContent = '조회에 실패했습니다.';
      $('empty').style.display = '';
    }finally{
      state.loading = false;
      syncButtons();
    }
  }

  function exportXlsx(){
    // 화면에 떠 있는 데이터의 조건(조회 시점)으로 내려받는다. 현재 툴바 값을 쓰면
    // 조회 후 조건을 바꿨을 때 화면과 다른 기간의 파일이 나온다.
    if(!state.query || !state.runId || !state.sourceSha) return;
    const query = new URLSearchParams(state.query);
    query.set('run_id', state.runId);
    query.set('source_sha256', state.sourceSha);
    // '격차율 발생분만'을 켠 채 내려받으면 화면에 보이는 것만 담는다 — 화면과 파일이
    // 다르면 어느 쪽이 맞는지 재무팀이 다시 대조해야 한다. 서버도 같은 선을 쓴다.
    if($('gapOnly') && $('gapOnly').checked) query.set('flt', '격차발생');
    window.A10_DOWNLOAD(`/api/fee-basis/export.xlsx?${query.toString()}`);
  }

  window.A10_READY.then(() => {
    initControls();
    $('runButton').addEventListener('click', run);
    // save() 를 그대로 넘기면 DOM 이 첫 인자로 PointerEvent 를 준다. 그게 retried 로
    // 새어 들어가 항상 truthy 가 되고, 409 복구 분기(`&& !retried`)가 죽은 코드가 된다.
    // 실측: 클릭 저장 3회 전부 409 인데 재조회 GET 0회였다.
    $('saveButton').addEventListener('click', () => save());
    $('exportButton').addEventListener('click', exportXlsx);
    $('gapOnly').addEventListener('change', () => { applyGapOnly(); applyFind(false); });
    $('rowFilter').addEventListener('input', () => applyFind(false));
    $('rowFilter').addEventListener('keydown', event => {
      if(event.key === 'Escape'){ $('rowFilter').value = ''; applyFind(false); return; }
      if(event.key === 'Enter' && !event.isComposing){
        event.preventDefault();
        applyFind(true);
      }
    });
    // 미저장 편집분을 들고 창을 닫는 사고를 막는다.
    window.addEventListener('beforeunload', event => {
      if(!state.draft.size) return;
      event.preventDefault();
      event.returnValue = '';
    });
    syncButtons();
  });
})();
</script>
</body>
</html>
