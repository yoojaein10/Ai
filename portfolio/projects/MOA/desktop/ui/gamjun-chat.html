<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MOA · 입금 대사</title>
  <link rel="icon" type="image/svg+xml" href="/ui/moa-icon.svg">
  <link rel="stylesheet" href="/ui/dashboard.css?v=20260821-2">
  <link rel="stylesheet" href="/ui/desktop.css?v=20260820-1">
  <link rel="stylesheet" href="/ui/gamjun-chat.css?v=20260808-3">
</head>
<body>
  <a class="skip-link" href="#main-content">본문으로 바로가기</a>
  <header class="topbar">
    <div class="brand-block"><span class="brand-logo"><img src="/ui/moa-icon.svg" alt="">MOA</span><h1>입금 대사</h1></div>
    <span class="chat-state" id="chatState">확인 중…</span>
  </header>
  <div class="app-shell">
    <aside class="sidebar" aria-label="업무 메뉴">
      <p class="sidebar-label">업무 메뉴</p>
      <nav class="side-nav"></nav>
    </aside>
    <main id="main-content">
      <form class="toolbar" id="queryForm" aria-label="조회 조건">
        <label><span>시작일</span><input id="dateFrom" type="date"></label>
        <label><span>종료일</span><input id="dateTo" type="date"></label>
        <label class="check-label"><span>조회 범위</span>
          <span class="check-inline"><input id="allRows" type="checkbox"><em>전체조회</em></span>
        </label>
        <label class="term-label"><span>키워드 · 번호</span>
          <input id="question" type="search" maxlength="300" autocomplete="off"
                 placeholder="거래처 이름, 또는 번호만 넣어도 됩니다 (번호는 전체 기간에서 찾습니다)">
        </label>
        <button type="submit" id="searchButton" class="primary-button">조회</button>
      </form>

      <!-- 감정서 LIST 와 같은 골격: 왼쪽 목록 · 오른쪽 상세 (2026-08-06 요청) -->
      <section class="workspace">
        <article class="list-panel" aria-label="조회 결과">
          <div class="list-head">
            <h2 id="listTitle">입금 대사</h2>
            <span class="list-count" id="listCount"></span>
          </div>
          <div class="result-body" id="resultBody">
            <p class="empty">기간을 정하고 <b>조회</b>를 누르세요.</p>
          </div>
        </article>

        <aside class="detail-panel" id="matchSide" aria-live="polite">
          <div class="detail-placeholder" id="matchPlaceholder">
            <div class="document-mark">文</div>
            <h2>거래를 선택하세요</h2>
            <p>왼쪽 목록에서 한 줄을 고르면 그 입금의 감정서를 찾아 보여드립니다.</p>
          </div>
        </aside>
      </section>
    </main>
  </div>
  <script src="/ui/context.js?v=20260911-1"></script>
  <script src="/ui/column-resize.js"></script>
  <script src="/ui/gamjun-chat.js?v=20260808-3"></script>
</body>
</html>
