<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MOA · 권한 관리</title>
  <link rel="icon" type="image/svg+xml" href="/ui/moa-icon.svg">
  <link rel="stylesheet" href="/ui/dashboard.css?v=20260821-2">
  <link rel="stylesheet" href="/ui/desktop.css?v=20260820-1">
  <style>
    .grant-form{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
    .grant-form label{display:flex;flex-direction:column;gap:4px;font-size:12px}
    .grant-form input{min-width:180px}
    .perm-table td.center,.perm-table th.center{text-align:center}
    .badge-on{color:#1b7a43;font-weight:700}
    .badge-off{color:#9ca3af}
    .badge-retired{color:#c62828;font-size:11px;margin-left:4px}
    .revoke-button{border:1px solid #d4a0a0;background:#fff5f5;color:#b04a4a;border-radius:8px;padding:4px 10px;cursor:pointer}
    .revoke-button:disabled{opacity:.5;cursor:default}
    .sync-form{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
    .sync-form label{display:flex;flex-direction:column;gap:4px;font-size:12px}
    .sync-form input,.sync-form select{width:140px}
    .sync-status{font-size:12px;color:var(--muted);margin:0 0 10px;align-self:center}
    .sync-status.error{color:#c62828}
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">본문으로 바로가기</a>
  <header class="topbar">
    <div class="brand-block"><span class="brand-logo"><img src="/ui/moa-icon.svg" alt="">MOA</span><h1>권한 관리</h1></div>
  </header>
  <div class="app-shell">
    <aside class="sidebar" aria-label="업무 메뉴">
      <p class="sidebar-label">업무 메뉴</p>
      <nav class="side-nav"></nav>
    </aside>
  <main id="main-content">
    <section class="toolbar" aria-label="권한 부여">
      <div class="grant-form">
        <label><span>직원 검색</span><input id="empSearch" list="empList" placeholder="이름 입력" autocomplete="off"></label>
        <label><span>메모 (선택)</span><input id="memoInput" maxlength="200" placeholder="부여 사유 등"></label>
        <button id="grantButton" class="primary-button" type="button">전체지사 조회 권한 부여</button>
      </div>
      <div class="sync-form">
        <label><span>조회 방식</span><select id="syncMode"><option value="days">최근 일수</option><option value="range">기간 직접 지정</option></select></label>
        <label id="syncDaysLabel"><span>전표 가져올 일수 (최대 365)</span><input id="syncDays" type="number" min="1" max="365" value="60"></label>
        <label id="syncFromLabel" class="hidden"><span>시작일</span><input id="syncDateFrom" type="date"></label>
        <label id="syncToLabel" class="hidden"><span>종료일</span><input id="syncDateTo" type="date"></label>
        <button id="syncButton" class="primary-button" type="button">전표 가져오기</button>
        <p id="syncStatus" class="sync-status"></p>
      </div>
    </section>
    <section class="workspace single-workspace">
      <article class="list-panel">
        <div class="panel-heading">
          <div><h2>전체지사 조회 권한</h2><p id="resultSummary">조회 중...</p></div>
        </div>
        <div class="table-wrap">
          <table id="permTable" class="perm-table">
            <colgroup>
              <col style="width:100px"><col style="width:90px"><col style="width:110px"><col style="width:120px">
              <col style="width:220px"><col style="width:130px"><col style="width:80px">
            </colgroup>
            <thead>
              <tr>
                <th>이름</th><th>아이디</th><th>소속</th><th class="center">권한 상태</th>
                <th>메모</th><th>변경일시</th><th class="center">처리</th>
              </tr>
            </thead>
            <tbody id="permRows"></tbody>
          </table>
          <div id="emptyList" class="empty hidden">부여된 권한이 없습니다. 기본 규칙(본사=전체, 지사=자기 지사)만 적용 중입니다.</div>
        </div>
      </article>
    </section>
  </main>
  </div>
  <datalist id="empList"></datalist>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script src="/ui/context.js?v=20260911-1"></script>
  <script src="/ui/column-resize.js"></script>
  <script src="/ui/permissions.js"></script>
</body>
</html>
