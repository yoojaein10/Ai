<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MOA · 엑셀 대사</title>
  <link rel="icon" type="image/svg+xml" href="/ui/moa-icon.svg">
  <link rel="stylesheet" href="/ui/dashboard.css?v=20260821-2">
  <link rel="stylesheet" href="/ui/desktop.css?v=20260820-1">
  <style>
    .toolbar{display:block}  /* 공통 6칸 그리드 해제 (이 화면은 자유 배치) */
    .rc-toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    .rc-toolbar .grp>strong{white-space:nowrap;flex:none}
    .rc-toolbar input[type=date]{width:auto}
    .rc-toolbar input[type=file]{width:auto}
    .rc-file{display:flex;gap:8px;align-items:center}
    .rc-cols{display:none;gap:12px;align-items:center;flex-wrap:wrap;margin-top:4px}
    .rc-cols.show{display:flex}
    .rc-cols select{height:32px;border:1px solid var(--line);border-radius:8px;padding:0 8px}
    .rc-summary{font-size:13px;margin:12px 0;display:flex;gap:20px;flex-wrap:wrap}
    .rc-summary b{font-variant-numeric:tabular-nums}
    .rc-summary .diff0{color:#1b7a43;font-weight:800}
    .rc-summary .diffx{color:#c62828;font-weight:800}
    .rc-check{border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
    .rc-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 16px;cursor:pointer;background:#fafbfb}
    .rc-head h2{margin:0;font-size:14px}
    .rc-head .cnt{font-weight:800}
    .rc-body{padding:0 16px 12px}
    .rc-table{width:100%;border-collapse:collapse;font-size:13px}
    .rc-table th,.rc-table td{padding:6px 8px;border-bottom:1px solid #f0f3f1;text-align:left}
    .rc-table td.num{text-align:right;font-variant-numeric:tabular-nums}
    .rc-table th.num{text-align:center}
    .rc-table td.down{color:#c62828}
    .rc-export{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 11px;font-weight:700;cursor:pointer}
    .rc-hint{font-size:12px;color:var(--muted);margin:6px 0}
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">본문으로 바로가기</a>
  <header class="topbar">
    <div class="brand-block"><span class="brand-logo"><img src="/ui/moa-icon.svg" alt="">MOA</span><h1>엑셀 대사</h1></div>
  </header>
  <div class="app-shell">
    <aside class="sidebar" aria-label="업무 메뉴">
      <p class="sidebar-label">업무 메뉴</p>
      <nav class="side-nav"></nav>
    </aside>
  <main id="main-content">
    <section class="toolbar" aria-label="엑셀 대사">
      <div class="rc-toolbar">
        <div class="rc-file"><input id="file" type="file" accept=".xlsx,.xls"></div>
        <div class="grp" style="display:flex;gap:6px;align-items:center"><strong>전표일자</strong><input id="dateFrom" type="date"> ~ <input id="dateTo" type="date"></div>
        <button id="runButton" class="primary-button" type="button">대사</button>
      </div>
      <div id="colRow" class="rc-cols">
        <label>감정서번호 열 <select id="docCol"></select></label>
        <label>금액 열 <select id="amountCol"></select></label>
        <button id="rerunButton" class="rc-export" type="button">이 열로 다시 대사</button>
      </div>
      <p class="rc-hint">감정서번호·금액 열은 자동 감지됩니다. 잘못 잡히면 위에서 열을 바꿔 다시 대사하세요. 우리 매출(전표 401계열, 본사) 기준으로 맞춰봅니다.</p>
    </section>
    <div id="summary" class="rc-summary"></div>
    <div id="groups"></div>
    <div id="empty" class="rc-hint">엑셀을 올리고 "대사"를 누르세요.</div>
  </main>
  </div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script src="/ui/context.js?v=20260911-1"></script>
  <script src="/ui/column-resize.js"></script>
  <script src="/ui/reconcile.js"></script>
</body>
</html>
